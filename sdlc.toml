["@infra-components"]
infra_code = true
derived_paths = [".js/node_modules", ".js/dist", ".js/metadata.json", ".js/infra-bundle.tar.gz"]

["@infra-components".build.default]
managed_lifetime = "process-group-v1"
build_inputs = { include = ["**"], exclude = [".js/**"] }
build_cmd = "(cd .js && bun install) && sdlc-components-build --bundle"
build_destination = "file://.js/infra-bundle.tar.gz"
build_deps = []
